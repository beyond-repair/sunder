[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "sunder"
version = "0.1.0"
description = "Local-first autonomous coding agent with hyperspherical VSA memory, constitutional gates, and version-forking."
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
authors = [{ name = "Beyond-Repair / Atomic Dream Labs" }]
keywords = ["agent", "coding", "vsa", "offline", "sovereign"]
classifiers = [
  "Development Status :: 3 - Alpha",
  "License :: OSI Approved :: MIT License",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Topic :: Software Development",
]
dependencies = [
  "numpy>=1.26.0",
  "pynacl>=1.5.0",
  "rich>=13.0.0",
  "click>=8.1.0",
  "httpx>=0.27.0",
]

[project.optional-dependencies]
dev = ["pytest>=7.0.0"]

[project.scripts]
sunder = "sunder.__main__:main"

[tool.setuptools.packages.find]
where = ["."]
include = ["sunder*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
